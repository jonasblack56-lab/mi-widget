<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>¡Gracias por tu Donación!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #02a95c 0%, #018a4b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Confeti */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -20px;
            opacity: 0;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0.3;
            }
        }

        /* Contenido principal */
        .thankyou-content {
            background: white;
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 2;
            animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Icono de check */
        .thankyou-icon-wrapper {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #d4f5d4 0%, #a7e9af 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: iconPulse 2s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .thankyou-icon-wrapper::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #d4f5d4 0%, #a7e9af 100%);
            animation: iconRipple 2s ease-out infinite;
            z-index: -1;
        }

        @keyframes iconRipple {
            0% {
                transform: scale(1);
                opacity: 0.6;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        .thankyou-icon {
            font-size: 50px;
            animation: checkBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
        }

        @keyframes checkBounce {
            0% { transform: scale(0); }
            60% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .thankyou-title {
            font-size: 28px;
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 12px;
            line-height: 1.2;
            animation: fadeIn 0.6s ease-out 0.4s both;
        }

        .thankyou-message {
            font-size: 16px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 24px;
            animation: fadeIn 0.6s ease-out 0.5s both;
        }

        .thankyou-amount-box {
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            border: 2px solid #a7e9af;
            border-radius: 16px;
            padding: 18px 24px;
            margin-bottom: 24px;
            animation: fadeIn 0.6s ease-out 0.6s both;
        }

        .thankyou-amount-label {
            font-size: 13px;
            color: #065f46;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .thankyou-amount {
            font-size: 36px;
            font-weight: 800;
            color: #02a95c;
            letter-spacing: -1px;
        }

        .thankyou-redirect {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            animation: fadeIn 0.6s ease-out 0.7s both;
        }

        .thankyou-countdown {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: #02a95c;
            color: white;
            border-radius: 50%;
            font-weight: 700;
            font-size: 16px;
            margin: 0 4px;
            animation: countdownPulse 1s ease-in-out infinite;
        }

        @keyframes countdownPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .thankyou-progress-bar {
            width: 100%;
            height: 6px;
            background: #e5e7eb;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 20px;
            animation: fadeIn 0.6s ease-out 0.7s both;
        }

        .thankyou-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #02a95c 0%, #02c96d 100%);
            width: 100%;
            transform-origin: left;
            animation: progressShrink 5s linear forwards;
            border-radius: 3px;
        }

        @keyframes progressShrink {
            from { transform: scaleX(1); }
            to { transform: scaleX(0); }
        }

        .thankyou-button {
            width: 100%;
            padding: 14px 24px;
            background: #02a95c;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            animation: fadeIn 0.6s ease-out 0.8s both;
        }

        .thankyou-button:hover {
            background: #018a4b;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 169, 92, 0.4);
        }

        .thankyou-share {
            margin-top: 16px;
            font-size: 13px;
            color: #666;
            animation: fadeIn 0.6s ease-out 0.9s both;
        }

        .thankyou-share a {
            color: #02a95c;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .thankyou-share a:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .thankyou-content {
                padding: 32px 24px;
                border-radius: 20px;
            }
            
            .thankyou-icon-wrapper {
                width: 80px;
                height: 80px;
            }
            
            .thankyou-icon {
                font-size: 40px;
            }
            
            .thankyou-title {
                font-size: 24px;
            }
            
            .thankyou-message {
                font-size: 15px;
            }
            
            .thankyou-amount {
                font-size: 30px;
            }
            
            .thankyou-amount-box {
                padding: 14px 18px;
            }
        }

        @media (max-width: 360px) {
            .thankyou-content {
                padding: 28px 20px;
            }
            
            .thankyou-title {
                font-size: 22px;
            }
            
            .thankyou-amount {
                font-size: 26px;
            }
        }

        /* Modo oscuro */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #065f46 0%, #047857 100%);
            }
            
            .thankyou-content {
                background: #1f2937;
            }
            
            .thankyou-title {
                color: white;
            }
            
            .thankyou-message {
                color: #d1d5db;
            }
            
            .thankyou-amount-box {
                background: linear-gradient(135deg, #064e3b 0%, #065f46 100%);
                border-color: #10b981;
            }
            
            .thankyou-amount-label {
                color: #a7f3d0;
            }
            
            .thankyou-redirect {
                color: #d1d5db;
            }
            
            .thankyou-progress-bar {
                background: #374151;
            }
            
            .thankyou-share {
                color: #d1d5db;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <!-- Confeti -->
    <div class="confetti-container" id="confettiContainer"></div>

    <!-- Contenido principal -->
    <div class="thankyou-content">
        <div class="thankyou-icon-wrapper">
            <span class="thankyou-icon">✅</span>
        </div>
        
        <h1 class="thankyou-title" id="thankyouTitle">¡Gracias por tu generosidad!</h1>
        
        <p class="thankyou-message" id="thankyouMessage">
            Tu donación ha sido procesada exitosamente. Tu apoyo hace la diferencia y ayuda a cumplir sueños.
        </p>
        
        <div class="thankyou-amount-box">
            <div class="thankyou-amount-label" id="thankyouAmountLabel">Monto donado</div>
            <div class="thankyou-amount" id="thankyouAmount">$0.00</div>
        </div>
        
        <div class="thankyou-redirect" id="thankyouRedirect">
            Serás redirigido automáticamente en <span class="thankyou-countdown" id="thankyouCountdown">5</span> segundos
        </div>
        
        <div class="thankyou-progress-bar">
            <div class="thankyou-progress-fill" id="thankyouProgressFill"></div>
        </div>
        
        <button class="thankyou-button" onclick="redirectNow()" id="thankyouButton">
            Volver ahora
        </button>
        
        <div class="thankyou-share" id="thankyouShare">
            ¿Quieres ayudar más? <a onclick="shareAfterDonation()" id="thankyouShareLink">Comparte esta campaña</a>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURACIÓN
        // ============================================
        const REDIRECT_URL = '/'; // 👈 CAMBIA ESTO por la URL de tu página principal
        const REDIRECT_SECONDS = 5;
        
        // Traducciones
        const translations = {
            es: {
                title: "¡Gracias por tu generosidad!",
                message: "Tu donación ha sido procesada exitosamente. Tu apoyo hace la diferencia y ayuda a cumplir sueños.",
                amountLabel: "Monto donado",
                redirect: "Serás redirigido automáticamente en",
                seconds: "segundos",
                button: "Volver ahora",
                share: "¿Quieres ayudar más?",
                shareLink: "Comparte esta campaña"
            },
            en: {
                title: "Thank you for your generosity!",
                message: "Your donation has been successfully processed. Your support makes a difference and helps fulfill dreams.",
                amountLabel: "Donated amount",
                redirect: "You will be automatically redirected in",
                seconds: "seconds",
                button: "Go back now",
                share: "Want to help more?",
                shareLink: "Share this campaign"
            }
        };

        // Detectar idioma
        function detectLanguage() {
            const savedLang = localStorage.getItem('gofundme_lang');
            if (savedLang && (savedLang === 'es' || savedLang === 'en')) {
                return savedLang;
            }
            
            const browserLang = navigator.language || navigator.userLanguage || 'es';
            const langCode = browserLang.toLowerCase().split('-')[0];
            
            if (langCode === 'en') return 'en';
            if (langCode === 'es') return 'es';
            
            return 'es';
        }

        let currentLang = detectLanguage();

        function t(key) {
            return translations[currentLang][key] || key;
        }

        function applyTranslations() {
            document.getElementById('thankyouTitle').textContent = t('title');
            document.getElementById('thankyouMessage').textContent = t('message');
            document.getElementById('thankyouAmountLabel').textContent = t('amountLabel');
            document.getElementById('thankyouButton').textContent = t('button');
            
            const redirectText = document.getElementById('thankyouRedirect');
            redirectText.innerHTML = `${t('redirect')} <span class="thankyou-countdown" id="thankyouCountdown">${REDIRECT_SECONDS}</span> ${t('seconds')}`;
            
            const shareText = document.getElementById('thankyouShare');
            shareText.innerHTML = `${t('share')} <a onclick="shareAfterDonation()" id="thankyouShareLink">${t('shareLink')}</a>`;
        }

        // Crear confeti
        function createConfetti() {
            const container = document.getElementById('confettiContainer');
            container.innerHTML = '';
            
            const colors = ['#02a95c', '#fbbf24', '#ef4444', '#3b82f6', '#a855f7', '#ec4899', '#10b981'];
            const shapes = ['circle', 'square'];
            
            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                
                const color = colors[Math.floor(Math.random() * colors.length)];
                const shape = shapes[Math.floor(Math.random() * shapes.length)];
                const size = Math.random() * 10 + 6;
                
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.width = size + 'px';
                confetti.style.height = size + 'px';
                confetti.style.background = color;
                confetti.style.borderRadius = shape === 'circle' ? '50%' : '2px';
                confetti.style.animationDuration = (Math.random() * 2 + 3) + 's';
                confetti.style.animationDelay = (Math.random() * 2) + 's';
                
                container.appendChild(confetti);
            }
        }

        // Countdown y redirección
        let countdownInterval = null;
        let countdownValue = REDIRECT_SECONDS;

        function startCountdown() {
            countdownValue = REDIRECT_SECONDS;
            const countdownEl = document.getElementById('thankyouCountdown');
            const progressFill = document.getElementById('thankyouProgressFill');
            
            // Reiniciar animación de la barra
            progressFill.style.animation = 'none';
            void progressFill.offsetWidth;
            progressFill.style.animation = `progressShrink ${REDIRECT_SECONDS}s linear forwards`;
            
            countdownInterval = setInterval(() => {
                countdownValue--;
                if (countdownEl) {
                    countdownEl.textContent = countdownValue;
                }
                
                if (countdownValue <= 0) {
                    clearInterval(countdownInterval);
                    redirectNow();
                }
            }, 1000);
        }

        // Redirigir
        function redirectNow() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
            
            // Limpiar sessionStorage
            sessionStorage.removeItem('lastDonationTotal');
            sessionStorage.removeItem('stripeSessionId');
            
            // Redirigir
            window.location.href = REDIRECT_URL;
        }

        // Compartir
        function shareAfterDonation() {
            const shareData = {
                title: "Ayuda a cumplir el sueño de Luis",
                text: "Acabo de donar a esta campaña. ¡Únete y ayuda a cumplir sueños!",
                url: window.location.origin + REDIRECT_URL,
            };

            if (navigator.share) {
                navigator.share(shareData).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.origin + REDIRECT_URL).then(() => {
                    alert('🔗 ¡Enlace copiado al portapapeles!');
                });
            }
        }

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            // Obtener monto de la URL
            const urlParams = new URLSearchParams(window.location.search);
            const amount = parseFloat(urlParams.get('amount')) || 0;
            
            // Mostrar monto
            document.getElementById('thankyouAmount').textContent = '$' + amount.toFixed(2);
            
            // Aplicar traducciones
            applyTranslations();
            
            // Crear confeti
            createConfetti();
            
            // Iniciar countdown
            startCountdown();
        });

        // Tecla ESC para salir
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                redirectNow();
            }
        });
    </script>
</body>
</html>
